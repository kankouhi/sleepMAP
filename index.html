<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>居眠り議員マップ（デモ）</title>
<style>
  :root{
    --ink:#2B2721;
    --ink-soft:#7C7362;
    --bg:#F7F1E4;
    --surface:#FFFFFF;
    --surface-alt:#FBF6EA;
    --grid:#E8DFC9;
    --chrome-bg:#F1E9D4;
    --chrome-ink:#97896D;
    --brand:#3E7EBD;
    --brand-soft:#E7F0F8;
    --yellow:#E3A93B;
    --yellow-soft:#FBF0D9;
    --red:#E2604F;
    --red-soft:#FBE4DF;
    --green:#3C9C7C;
    --green-soft:#E1F1EA;
    --blue:#3E7EBD;
    --blue-soft:#E7F0F8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Yu Gothic","YuGothic","游ゴシック体","Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
    font-size:13.5px;
    line-height:1.6;
  }
  a{color:var(--brand);}
  table{font-variant-numeric:tabular-nums;}
  h1,h2{text-wrap:balance;}

  /* ---------- 上部固定クローム：タイトルバー／通知バー ---------- */
  #app-chrome-top{position:fixed; top:0; left:0; right:0; z-index:1000;}
  .titlebar{
    background:var(--surface-alt); border-bottom:1px solid var(--grid);
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 16px;
  }
  .titlebar .brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:14.5px; color:var(--ink);}
  .titlebar .brand-badge{
    flex:none; width:26px; height:26px; border-radius:8px; background:var(--brand);
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
  }
  .titlebar .tag{
    font-size:10.5px; font-weight:700; color:var(--ink-soft); background:var(--chrome-bg);
    border:1px solid var(--grid); padding:3px 10px; border-radius:999px; letter-spacing:0.02em;
  }

  .noticebar{
    background:var(--yellow-soft); border-bottom:1px solid var(--grid);
    display:flex; align-items:center; gap:9px;
    padding:8px 16px; font-size:12.5px; color:#6B5410;
  }
  .noticebar .flag{
    flex:none; width:18px; height:18px; border-radius:50%; background:var(--yellow); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:11px;
  }
  .noticebar b{color:#8a4b1f;}

  /* ---------- 下部固定シートタブ ---------- */
  #app-chrome-bottom{
    position:fixed; bottom:0; left:0; right:0; z-index:1000;
    background:var(--surface); border-top:1px solid var(--grid);
    box-shadow:0 -4px 14px rgba(60,40,10,0.06);
    overflow-x:auto; white-space:nowrap;
  }
  .sheet-tabs{display:flex; align-items:stretch; height:42px; padding:0 8px; gap:4px;}
  .sheet-tabs a{
    display:flex; align-items:center; padding:0 16px; font-size:12.5px; font-weight:700;
    color:var(--ink-soft); text-decoration:none; border-radius:10px 10px 0 0; margin-top:6px;
  }
  .sheet-tabs a.active{background:var(--brand-soft); color:var(--brand);}
  .sheet-tabs a:hover:not(.active){background:var(--chrome-bg);}

  main{max-width:1100px; margin:0 auto; padding:18px 14px 24px;}

  /* ---------- ホーム：ヒーロー ---------- */
  .hero{
    position:relative; overflow:hidden; background:var(--surface-alt);
    border:1px solid var(--grid); border-radius:20px; padding:32px 22px; text-align:center; margin-bottom:18px;
  }
  .hero::before{
    content:""; position:absolute; top:-90px; right:-60px; width:260px; height:260px;
    background:radial-gradient(circle, var(--yellow) 0%, transparent 70%); opacity:0.28;
  }
  .hero::after{
    content:""; position:absolute; bottom:-120px; left:-60px; width:280px; height:280px;
    background:radial-gradient(circle, var(--blue) 0%, transparent 70%); opacity:0.22;
  }
  .hero-title{position:relative; z-index:1; font-size:1.6rem; font-weight:800; margin:0 0 8px; letter-spacing:0.01em;}
  .hero-sub{position:relative; z-index:1; color:var(--ink-soft); font-size:13px; margin:0 0 22px;}
  .feature-grid{
    position:relative; z-index:1; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; text-align:left;
  }
  .feature-item{
    background:var(--surface); border:1px solid var(--grid); border-radius:12px; padding:12px;
    display:flex; gap:10px; align-items:flex-start;
  }
  .feature-icon{
    flex:none; width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:14px;
  }
  .feature-icon.yellow{background:var(--yellow);}
  .feature-icon.red{background:var(--red);}
  .feature-icon.green{background:var(--green);}
  .feature-icon.blue{background:var(--blue);}
  .feature-title{font-weight:700; font-size:12.5px; margin-bottom:2px;}
  .feature-sub{font-size:11px; color:var(--ink-soft); line-height:1.4;}

  /* ---------- 汎用ブロック ---------- */
  .block{
    background:var(--surface); border:1px solid var(--grid); border-radius:14px; margin-bottom:18px;
    overflow:hidden; box-shadow:0 1px 3px rgba(60,40,10,0.05);
  }
  .block-head{
    background:var(--surface-alt); border-bottom:1px solid var(--grid);
    padding:10px 16px; font-weight:700; font-size:13.5px; color:var(--ink);
    display:flex; align-items:center; gap:9px;
  }
  .block-head .dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .block-head .dot.yellow{background:var(--yellow);}
  .block-head .dot.red{background:var(--red);}
  .block-head .dot.green{background:var(--green);}
  .block-head .dot.blue{background:var(--blue);}
  .block-head .back-link{margin-left:auto; font-weight:400; font-size:12px;}
  .block-body{padding:14px 16px;}

  .comment-box{
    background:var(--yellow-soft); border:1px solid #EAD9AE; border-radius:12px;
    padding:11px 15px; font-size:12.5px; color:#5b4a12; margin-bottom:16px;
  }
  .comment-box .comment-label{
    display:block; font-weight:700; font-size:10.5px; color:#8a6d1f;
    text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px;
  }

  /* ---------- スプレッドシート・テーブル ---------- */
  .sheet-wrap{overflow-x:auto;}
  table.sheet{border-collapse:collapse; width:100%; font-size:12.5px; min-width:600px;}
  table.sheet th, table.sheet td{
    border:1px solid var(--grid); padding:6px 10px; white-space:nowrap;
  }
  table.sheet .chrome{
    background:var(--chrome-bg); color:var(--chrome-ink); text-align:center;
    font-weight:600; font-size:11.5px; position:sticky; z-index:2;
  }
  table.sheet .chrome.corner{left:0; top:0; z-index:3; width:34px;}
  table.sheet .chrome.col-letter{top:0;}
  table.sheet .chrome.row-num{left:0; width:34px;}
  table.sheet .cell{background:var(--surface); color:var(--ink);}
  table.sheet .cell.head{font-weight:700; background:var(--surface-alt);}
  table.sheet .cell.head.tint-yellow{background:var(--yellow-soft);}
  table.sheet .cell.sticky-col{position:sticky; left:34px; z-index:1; background:#FDFBF3;}
  table.sheet tbody tr.row-link:hover td{background:var(--brand-soft);}
  table.sheet tbody tr.row-link{cursor:pointer;}
  table.sheet .cell.fmt-positive{background:var(--green-soft); color:#1f5536;}
  table.sheet .cell.fmt-warning{background:var(--red-soft); color:#8a3226;}
  table.sheet .cell a.cell-link{color:var(--brand); text-decoration:none; font-weight:600;}
  table.sheet .cell a.cell-link:hover{text-decoration:underline;}
  table.sheet .cell.dim{color:var(--chrome-ink);}

  .mini-badge{
    display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px;
    border-radius:50%; font-size:9px; color:#fff; margin-right:5px; font-weight:800; flex:none;
  }
  .mini-badge.confirmed{background:var(--blue);}
  .mini-badge.unclear{background:var(--ink-soft);}

  .databar-cell{position:relative; min-width:110px;}
  .databar-track{position:relative; height:14px; background:var(--chrome-bg); border-radius:7px; overflow:hidden;}
  .databar-fill{position:absolute; left:0; top:0; bottom:0; background:var(--yellow);}
  .databar-label{position:relative; z-index:1; font-weight:700; padding-left:6px;}

  .video-cell-link{
    color:var(--brand); cursor:pointer; font-weight:600; text-decoration:none; border-bottom:1px dotted var(--brand);
  }

  /* ---------- ツールバー（フィルタ／並び替え） ---------- */
  .toolbar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    padding:10px 16px; background:var(--surface-alt); border-bottom:1px solid var(--grid);
  }
  .toolbar .group{display:flex; align-items:center; gap:7px; white-space:nowrap;}
  .toolbar label{color:var(--ink-soft); font-weight:600; white-space:nowrap; font-size:12px;}
  .toolbar select{
    font-family:inherit; font-size:12px; border:1px solid var(--grid); border-radius:999px;
    background:#fff; padding:5px 12px; color:var(--ink);
  }

  /* ---------- プロフィールの record シート ---------- */
  .record-grid{
    display:grid; grid-template-columns:120px 1fr; border:1px solid var(--grid); border-radius:10px;
    overflow:hidden; font-size:12.5px;
  }
  .record-grid > div{border-bottom:1px solid var(--grid); border-right:1px solid var(--grid); padding:7px 11px;}
  .record-grid > div:nth-child(odd){background:var(--surface-alt); color:var(--ink-soft); font-weight:600;}
  .record-grid > div:nth-last-child(-n+2){border-bottom:none;}

  .kpi-row{display:flex; gap:10px; padding:0 16px 16px;}
  .kpi{flex:1; border:1px solid var(--grid); border-radius:12px; padding:11px 15px;}
  .kpi.yellow{background:var(--yellow-soft);}
  .kpi.blue{background:var(--blue-soft);}
  .kpi .num{font-size:1.5rem; font-weight:800;}
  .kpi.yellow .num{color:#8a5a0d;}
  .kpi.blue .num{color:#2a5a86;}
  .kpi .label{font-size:11px; color:var(--ink-soft); margin-top:2px;}

  /* ---------- モーダル ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(40,30,15,0.42); display:none;
    align-items:center; justify-content:center; z-index:2000; padding:16px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:#fff; border-radius:14px; overflow:hidden; max-width:360px; width:100%;
    box-shadow:0 12px 34px rgba(40,30,10,0.2);
  }
  .modal-titlebar{
    background:var(--brand); color:#fff; padding:9px 14px; font-size:12.5px; font-weight:700;
    display:flex; justify-content:space-between; align-items:center;
  }
  .modal-titlebar button{
    background:none; border:none; color:#fff; font-size:15px; cursor:pointer; line-height:1;
    padding:2px 6px; opacity:0.85;
  }
  .modal-titlebar button:hover{opacity:1;}
  .modal-body{padding:18px 18px 16px; font-size:12.5px; color:var(--ink);}
  .modal-body .ok-btn{
    margin-top:14px; padding:6px 20px; border:none; border-radius:999px; background:var(--brand); color:#fff;
    font-family:inherit; font-size:12px; font-weight:700; cursor:pointer;
  }
  .modal-body .ok-btn:hover{background:#356b9f;}

  footer{
    text-align:center; color:var(--ink-soft); font-size:11.5px; padding:8px 14px 24px; max-width:1100px; margin:0 auto;
  }

  @media (max-width:640px){
    body{font-size:13px;}
    .titlebar .tag{display:none;}
    .hero{padding:24px 16px;}
    .hero-title{font-size:1.3rem;}
    .feature-grid{grid-template-columns:repeat(2,1fr);}
    .kpi .num{font-size:1.2rem;}
  }
</style>
</head>
<body>

<div id="app-chrome-top">
  <div class="titlebar">
    <span class="brand"><span class="brand-badge">眠</span>居眠り議員マップ</span>
    <span class="tag">デモ版・架空データ</span>
  </div>
  <div class="noticebar">
    <span class="flag">!</span>
    <span>これは<b>サンプルデモ</b>です。登場人物・データはすべて<b>架空</b>であり、実在の政治家・政党とは一切関係ありません。</span>
  </div>
</div>

<main id="app"></main>

<footer>
  本デモは架空の人物・架空のデータのみで構成されたビジュアルサンプルです。実在の個人・団体を評価するものではありません。
</footer>

<div id="app-chrome-bottom">
  <nav class="sheet-tabs" id="sheet-tabs">
    <a href="#/" data-route="/">マップ</a>
    <a href="#/list" data-route="/list">議員一覧</a>
    <a href="#/about" data-route="/about">このサイトについて</a>
  </nav>
</div>

<div class="modal-overlay" id="video-modal">
  <div class="modal-box">
    <div class="modal-titlebar">
      <span>動画プレーヤー（デモ）</span>
      <button id="video-modal-close" aria-label="閉じる">×</button>
    </div>
    <div class="modal-body">
      このリンクはデモ用のダミーです。実際には動画は存在せず、再生もされません。
      <div><button class="ok-btn" id="video-modal-ok">OK</button></div>
    </div>
  </div>
</div>

<script>
/* ==========================================================
   モックデータ（すべて架空。実在の人物・団体とは無関係です）
   ========================================================== */

const PARTIES = ["みらい創造党", "国民の声党", "新緑同盟"];

const LEGISLATORS = [
  { id:"L1", name:"夢見 一郎",   kana:"ゆめみ いちろう", party:"みらい創造党", district:"居眠県第1区",     terms:3 },
  { id:"L2", name:"寝坊 花子",   kana:"ねぼう はなこ",   party:"国民の声党",   district:"微睡県第2区",     terms:2 },
  { id:"L3", name:"居眠 圭介",   kana:"いねむり けいすけ", party:"みらい創造党", district:"比例北部ブロック", terms:5 },
  { id:"L4", name:"舟漕 三郎",   kana:"ふねこぎ さぶろう", party:"新緑同盟",     district:"舟漕県第3区",     terms:1 },
  { id:"L5", name:"半眼田 五郎", kana:"はんがんだ ごろう", party:"国民の声党",   district:"半眼県第1区",     terms:4 },
  { id:"L6", name:"瞬 美咲",     kana:"まばたき みさき", party:"新緑同盟",     district:"比例中部ブロック", terms:2 },
  { id:"L7", name:"睡魔 次郎",   kana:"すいま じろう",   party:"みらい創造党", district:"寝落ち県第2区",   terms:6 },
  { id:"L8", name:"目覚谷 ひろし", kana:"めざめだに ひろし", party:"国民の声党", district:"比例南部ブロック", terms:3 },
];

const MEETINGS = [
  { id:"M1",  name:"本会議",             datetime:"2026-01-23 10:00" },
  { id:"M2",  name:"予算委員会",         datetime:"2026-02-05 13:00" },
  { id:"M3",  name:"厚生労働委員会",     datetime:"2026-02-18 10:00" },
  { id:"M4",  name:"予算委員会（参議院）", datetime:"2026-02-25 14:00" },
  { id:"M5",  name:"決算行政監視委員会", datetime:"2026-03-10 10:00" },
  { id:"M6",  name:"文部科学委員会",     datetime:"2026-03-24 13:30" },
  { id:"M7",  name:"国土交通委員会",     datetime:"2026-04-07 10:00" },
  { id:"M8",  name:"本会議（参議院）",   datetime:"2026-04-21 13:00" },
  { id:"M9",  name:"経済産業委員会",     datetime:"2026-05-12 10:00" },
  { id:"M10", name:"深夜審議・特別委員会", datetime:"2026-06-02 23:40" },
];

const SOURCES = [
  "国会中継アーカイブ（架空）",
  "議事録映像（架空）",
  "SNS投稿（架空）",
  "報道映像（架空）",
];

// explanation: null = 説明なし
const EVENTS = [
  { id:"E1",  legislatorId:"L1", meetingId:"M1",  minutes:8,  source:SOURCES[0], video:"#demo-video-1",  explanation:null, confidence:"confirmed" },
  { id:"E2",  legislatorId:"L1", meetingId:"M3",  minutes:15, source:SOURCES[1], video:"#demo-video-2",  explanation:"体調不良と説明", confidence:"confirmed" },
  { id:"E3",  legislatorId:"L1", meetingId:"M9",  minutes:4,  source:SOURCES[2], video:"#demo-video-3",  explanation:null, confidence:"unclear" },
  { id:"E4",  legislatorId:"L1", meetingId:"M10", minutes:20, source:SOURCES[0], video:"#demo-video-4",  explanation:"深夜審議のため疲労と説明", confidence:"confirmed" },

  { id:"E5",  legislatorId:"L2", meetingId:"M2",  minutes:6,  source:SOURCES[2], video:"#demo-video-5",  explanation:null, confidence:"unclear" },
  { id:"E6",  legislatorId:"L2", meetingId:"M5",  minutes:12, source:SOURCES[1], video:"#demo-video-6",  explanation:"薬の副作用の可能性と説明", confidence:"confirmed" },
  { id:"E7",  legislatorId:"L2", meetingId:"M10", minutes:18, source:SOURCES[0], video:"#demo-video-7",  explanation:"深夜審議のため疲労と説明", confidence:"confirmed" },

  { id:"E8",  legislatorId:"L3", meetingId:"M1",  minutes:10, source:SOURCES[0], video:"#demo-video-8",  explanation:null, confidence:"confirmed" },
  { id:"E9",  legislatorId:"L3", meetingId:"M2",  minutes:9,  source:SOURCES[3], video:"#demo-video-9",  explanation:null, confidence:"confirmed" },
  { id:"E10", legislatorId:"L3", meetingId:"M4",  minutes:5,  source:SOURCES[2], video:"#demo-video-10", explanation:null, confidence:"unclear" },
  { id:"E11", legislatorId:"L3", meetingId:"M8",  minutes:14, source:SOURCES[1], video:"#demo-video-11", explanation:"考え事をしていたと説明", confidence:"unclear" },
  { id:"E12", legislatorId:"L3", meetingId:"M10", minutes:22, source:SOURCES[0], video:"#demo-video-12", explanation:null, confidence:"confirmed" },

  { id:"E13", legislatorId:"L4", meetingId:"M6",  minutes:3,  source:SOURCES[2], video:"#demo-video-13", explanation:null, confidence:"unclear" },
  { id:"E14", legislatorId:"L4", meetingId:"M7",  minutes:7,  source:SOURCES[1], video:"#demo-video-14", explanation:"体調不良と説明", confidence:"confirmed" },

  { id:"E15", legislatorId:"L5", meetingId:"M1",  minutes:11, source:SOURCES[0], video:"#demo-video-15", explanation:null, confidence:"confirmed" },
  { id:"E16", legislatorId:"L5", meetingId:"M3",  minutes:16, source:SOURCES[0], video:"#demo-video-16", explanation:null, confidence:"confirmed" },
  { id:"E17", legislatorId:"L5", meetingId:"M5",  minutes:6,  source:SOURCES[3], video:"#demo-video-17", explanation:"考え事をしていたと説明", confidence:"unclear" },
  { id:"E18", legislatorId:"L5", meetingId:"M9",  minutes:13, source:SOURCES[1], video:"#demo-video-18", explanation:null, confidence:"confirmed" },
  { id:"E19", legislatorId:"L5", meetingId:"M10", minutes:19, source:SOURCES[0], video:"#demo-video-19", explanation:"深夜審議のため疲労と説明", confidence:"confirmed" },

  { id:"E20", legislatorId:"L6", meetingId:"M6",  minutes:5,  source:SOURCES[2], video:"#demo-video-20", explanation:null, confidence:"unclear" },

  { id:"E21", legislatorId:"L7", meetingId:"M2",  minutes:9,  source:SOURCES[1], video:"#demo-video-21", explanation:null, confidence:"confirmed" },
  { id:"E22", legislatorId:"L7", meetingId:"M4",  minutes:17, source:SOURCES[0], video:"#demo-video-22", explanation:null, confidence:"confirmed" },
  { id:"E23", legislatorId:"L7", meetingId:"M8",  minutes:8,  source:SOURCES[3], video:"#demo-video-23", explanation:"薬の副作用の可能性と説明", confidence:"unclear" },
  { id:"E24", legislatorId:"L7", meetingId:"M10", minutes:21, source:SOURCES[0], video:"#demo-video-24", explanation:null, confidence:"confirmed" },
  // L8（目覚谷ひろし）は居眠りイベント 0 件
];

/* ==========================================================
   集計ユーティリティ
   ========================================================== */

function legislatorEvents(legislatorId){
  return EVENTS.filter(e => e.legislatorId === legislatorId);
}
function totalMinutes(legislatorId){
  return legislatorEvents(legislatorId).reduce((s,e)=>s+e.minutes,0);
}
function totalCount(legislatorId){
  return legislatorEvents(legislatorId).length;
}
function cellData(legislatorId, meetingId){
  const evs = EVENTS.filter(e=>e.legislatorId===legislatorId && e.meetingId===meetingId);
  return { count: evs.length, minutes: evs.reduce((s,e)=>s+e.minutes,0) };
}
const MAX_CELL_MINUTES = Math.max(...MEETINGS.flatMap(m=>LEGISLATORS.map(l=>cellData(l.id,m.id).minutes)));
const MAX_COUNT = Math.max(...LEGISLATORS.map(l=>totalCount(l.id)));

function heatColor(minutes){
  if(minutes<=0) return "#FFFFFF";
  const ratio = Math.min(1, minutes / MAX_CELL_MINUTES);
  // 白(255,255,255) -> 赤(226,96,79) の補間（条件付き書式の色スケールを模す）
  const r = Math.round(255 + (226-255)*ratio);
  const g = Math.round(255 + (96-255)*ratio);
  const b = Math.round(255 + (79-255)*ratio);
  return `rgb(${r},${g},${b})`;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function colLetter(n){
  let s = "", num = n + 1;
  while(num > 0){
    const rem = (num - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    num = Math.floor((num - 1) / 26);
  }
  return s;
}

/* ==========================================================
   スプレッドシート・テーブル生成
   columns: [{label, align, tint}]
   dataRows: [{ cells:[{html, align, class, style}], href? }]
   ========================================================== */

function sheetTable(columns, dataRows, opts){
  opts = opts || {};
  const stickyFirst = !!opts.stickyFirstCol;
  let html = '<div class="sheet-wrap"><table class="sheet"><thead>';
  html += '<tr><th class="chrome corner"></th>' +
    columns.map((_,i)=>`<th class="chrome col-letter">${colLetter(i)}</th>`).join('') + '</tr>';
  html += '<tr><th class="chrome row-num">1</th>' +
    columns.map((c,i)=>`<th class="cell head${c.tint?(' tint-'+c.tint):''}${stickyFirst&&i===0?' sticky-col':''}" style="text-align:${c.align||'left'}">${c.label}</th>`).join('') +
    '</tr></thead><tbody>';
  dataRows.forEach((row,ri)=>{
    const trAttrs = row.href ? ' class="row-link" data-href="'+row.href+'"' : '';
    html += `<tr${trAttrs}><td class="chrome row-num">${ri+2}</td>`;
    html += row.cells.map((c,ci)=>{
      const cls = [c.class||'', stickyFirst && ci===0 ? 'sticky-col':''].filter(Boolean).join(' ');
      return `<td class="cell${cls?(' '+cls):''}" style="text-align:${c.align||'left'};${c.style||''}">${c.html}</td>`;
    }).join('');
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function bindRowLinks(container){
  container.querySelectorAll('tr.row-link').forEach(tr=>{
    tr.addEventListener('click', ()=>{ location.hash = tr.dataset.href; });
  });
}

/* ==========================================================
   ルーター & レンダリング
   ========================================================== */

const app = document.getElementById("app");
const topChrome = document.getElementById("app-chrome-top");
const bottomChrome = document.getElementById("app-chrome-bottom");

function adjustChromePadding(){
  document.body.style.paddingTop = topChrome.offsetHeight + "px";
  document.body.style.paddingBottom = bottomChrome.offsetHeight + "px";
}

function render(){
  const hash = location.hash || "#/";
  const path = hash.replace(/^#/, "") || "/";
  updateNav(path);

  if(path === "/" || path === "") {
    app.innerHTML = renderHome();
  } else if(path === "/list") {
    app.innerHTML = renderList();
    bindListControls();
  } else if(path.startsWith("/legislator/")) {
    const id = path.split("/")[2];
    app.innerHTML = renderProfile(id);
  } else if(path === "/about") {
    app.innerHTML = renderAbout();
  } else {
    app.innerHTML = "<div class='block'><div class='block-body'>ページが見つかりません。</div></div>";
  }
  bindVideoLinks();
  bindRowLinks(app);
  window.scrollTo(0,0);
  adjustChromePadding();
}

function updateNav(path){
  const activeRoute = path.startsWith("/legislator/") ? "/list" : path;
  document.querySelectorAll("#sheet-tabs a").forEach(a=>{
    a.classList.toggle("active", a.dataset.route === activeRoute);
  });
}

/* ---------- マップ：ヒーロー + ヒートマップ + ランキング ---------- */

function renderHome(){
  const columns = [{label:"議員", align:"left"}].concat(
    MEETINGS.map(m=>({label:m.name, align:"right"}))
  );
  const rows = LEGISLATORS.map(leg=>{

      align:"left"
    }].concat(MEETINGS.map(m=>{
      const d = cellData(leg.id, m.id);
      return {
        html: d.minutes>0 ? `${d.minutes}` : '<span class="dim">―</span>',
        align:"right",
        style:`background:${heatColor(d.minutes)};`
      };
    }));
    return { cells, href:`/legislator/${leg.id}` };
  });

  const rankColumns = [
    {label:"順位", align:"right"},
    {label:"議員", align:"left"},
    {label:"政党", align:"left"},
    {label:"居眠り回数", align:"right", tint:"yellow"},
    {label:"合計時間(分)", align:"right", tint:"yellow"},
  ];
  const ranking = [...LEGISLATORS]
    .sort((a,b)=> totalCount(b.id)-totalCount(a.id) || totalMinutes(b.id)-totalMinutes(a.id))
    .slice(0,6);
  const rankRows = ranking.map((leg,i)=>{
    const c = totalCount(leg.id);
    const min = totalMinutes(leg.id);
    const pct = MAX_COUNT>0 ? Math.round((c/MAX_COUNT)*100) : 0;
    return {
      cells:[
        {html:String(i+1), align:"right"},
        {html:`<a class="cell-link" href="#/legislator/${leg.id}">${leg.name}</a>`, align:"left"},
        {html:leg.party, align:"left"},
        {html:`<div class="databar-cell"><div class="databar-track"><div class="databar-fill" style="width:${pct}%"></div></div><span class="databar-label">${c}件</span></div>`, align:"left"},
        {html:`${min}`, align:"right"},
      ],
      href:`/legislator/${leg.id}`
    };
  });

  return `
    <div class="hero">
      <h1 class="hero-title">居眠りも、見える形に。</h1>
      <p class="hero-sub">架空データでたどる「居眠り議員マップ」のデモです。まずは下のヒートマップから見てみましょう。</p>
      <div class="feature-grid">
        <div class="feature-item">
          <span class="feature-icon yellow">▦</span>
          <div><div class="feature-title">ヒートマップで一覧</div><div class="feature-sub">議員×会議を色の濃淡で表示</div></div>
        </div>
        <div class="feature-item">
          <span class="feature-icon red">!</span>
          <div><div class="feature-title">気になる記録も可視化</div><div class="feature-sub">居眠り時間・回数をひと目で</div></div>
        </div>
        <div class="feature-item">
          <span class="feature-icon green">✓</span>
          <div><div class="feature-title">説明の有無も併記</div><div class="feature-sub">一方的に断定しない設計</div></div>
        </div>
        <div class="feature-item">
          <span class="feature-icon blue">≡</span>
          <div><div class="feature-title">議員ごとに詳細を確認</div><div class="feature-sub">架空データのプロフィール付き</div></div>
        </div>
      </div>
    </div>

    <div class="comment-box">
      <span class="comment-label">コメント</span>
      「居眠り」の判定は本来グレーゾーンです。目を閉じていても考え事をしていた場合や、体調不良・服薬の影響で目を閉じていた場合もあります。このシートはあくまで記録の一例であり、断定的な評価ではありません。
    </div>

    <div class="block">
      <div class="block-head"><span class="dot red"></span>議員 × 会議　居眠りヒートマップ（架空データ）</div>
      <div class="block-body" style="padding-bottom:8px;">
        <p style="margin:0;color:var(--ink-soft);font-size:12px;">セルの色が濃いほど、その会議での居眠り推定時間（分）が長いことを示す条件付き書式です。数値は合計分数、行または議員名クリックで個別シートへ移動します。</p>
      </div>
      ${sheetTable(columns, rows, {stickyFirstCol:true})}
    </div>

    <div class="block">
      <div class="block-head"><span class="dot yellow"></span>居眠り回数ランキング（架空データ）</div>
      ${sheetTable(rankColumns, rankRows)}
    </div>
  `;
}

/* ---------- 議員一覧 ---------- */

let listState = { sort:"count", party:"all" };

function renderList(){
  return `
    <div class="block">
      <div class="block-head"><span class="dot blue"></span>議員一覧（架空データ）</div>
      <div class="toolbar">
        <div class="group">
          <label for="filter-party">政党</label>
          <select id="filter-party">
            <option value="all">すべて</option>
            ${PARTIES.map(p=>`<option value="${p}">${p}</option>`).join("")}
          </select>
        </div>
        <div class="group">
          <label for="sort-select">並び替え</label>
          <select id="sort-select">
            <option value="count">居眠り回数（多い順）</option>
            <option value="minutes">合計時間（長い順）</option>
            <option value="name">名前（五十音順）</option>
          </select>
        </div>
      </div>
      <div id="legislator-sheet"></div>
    </div>
  `;
}

function bindListControls(){
  const mount = document.getElementById("legislator-sheet");
  const partySel = document.getElementById("filter-party");
  const sortSel = document.getElementById("sort-select");
  partySel.value = listState.party;
  sortSel.value = listState.sort;

  const columns = [
    {label:"氏名", align:"left"},
    {label:"政党", align:"left"},
    {label:"選挙区／比例", align:"left"},
    {label:"当選回数", align:"right"},
    {label:"居眠り回数", align:"right", tint:"yellow"},
    {label:"合計時間(分)", align:"right", tint:"yellow"},
  ];

  function draw(){
    let items = LEGISLATORS.filter(l => listState.party==="all" || l.party===listState.party);
    if(listState.sort==="count") items.sort((a,b)=> totalCount(b.id)-totalCount(a.id));
    else if(listState.sort==="minutes") items.sort((a,b)=> totalMinutes(b.id)-totalMinutes(a.id));
    else items.sort((a,b)=> a.kana.localeCompare(b.kana,"ja"));

    const rows = items.map(l=>({
      cells:[
        {html:`<a class="cell-link" href="#/legislator/${l.id}">${l.name}</a>`, align:"left"},
        {html:l.party, align:"left"},
        {html:l.district, align:"left"},
        {html:`当選${l.terms}回`, align:"right"},
        {html:`${totalCount(l.id)}件`, align:"right"},
        {html:`${totalMinutes(l.id)}`, align:"right"},
      ],
      href:`/legislator/${l.id}`
    }));
    mount.innerHTML = sheetTable(columns, rows);
    bindRowLinks(mount);
  }

  partySel.addEventListener("change", e=>{ listState.party=e.target.value; draw(); });
  sortSel.addEventListener("change", e=>{ listState.sort=e.target.value; draw(); });
  draw();
}

/* ---------- 議員個別ページ ---------- */

function renderProfile(id){
  const leg = LEGISLATORS.find(l=>l.id===id);
  if(!leg){
    return `<div class="block"><div class="block-body">議員が見つかりません。<a href="#/list">一覧へ戻る</a></div></div>`;
  }
  const evs = legislatorEvents(id).slice().sort((a,b)=>{
    const ma = MEETINGS.find(m=>m.id===a.meetingId).datetime;
    const mb = MEETINGS.find(m=>m.id===b.meetingId).datetime;
    return mb.localeCompare(ma);
  });

  const columns = [
    {label:"日付", align:"left"},
    {label:"会議", align:"left"},
    {label:"推定時間(分)", align:"right", tint:"yellow"},
    {label:"出典", align:"left"},
    {label:"確度", align:"left"},
    {label:"本人・関係者の説明", align:"left"},
    {label:"動画", align:"left"},
  ];

  const rows = evs.map(e=>{
    const m = MEETINGS.find(mm=>mm.id===e.meetingId);
    const explained = !!e.explanation;
    const confHtml = e.confidence==="confirmed"
      ? '<span class="mini-badge confirmed">✓</span>明確に確認できる'
      : '<span class="mini-badge unclear">?</span>目を閉じていたが不明';
    return {
      cells:[
        {html:m.datetime, align:"left"},
        {html:m.name, align:"left"},
        {html:String(e.minutes), align:"right"},
        {html:`<span class="dim">${e.source}</span>`, align:"left"},
        {html:confHtml, align:"left"},
        {html: explained ? e.explanation : "説明なし", align:"left", class: explained ? "fmt-positive" : "fmt-warning"},
        {html:`<span class="video-cell-link" data-video="${e.video}">▶ 動画を見る（デモ）</span>`, align:"left"},
      ]
    };
  });

  const tableHtml = evs.length
    ? sheetTable(columns, rows)
    : `<div class="block-body" style="color:var(--ink-soft);">記録されている居眠りイベントはありません。</div>`;

  return `
    <div class="block">
      <div class="block-head"><span class="dot blue"></span>議員プロフィール（架空データ）<a href="#/list" class="back-link">&larr; 一覧へ戻る</a></div>
      <div class="block-body" style="padding-bottom:0;">
        <div class="record-grid">
          <div>氏名</div><div>${leg.name}（${leg.kana}）</div>
          <div>政党</div><div>${leg.party}</div>
          <div>選挙区／比例</div><div>${leg.district}</div>
          <div>当選回数</div><div>当選${leg.terms}回（すべて架空）</div>
        </div>
      </div>
      <div class="kpi-row" style="margin-top:14px;">
        <div class="kpi yellow"><div class="num">${totalCount(leg.id)}</div><div class="label">居眠り回数（件）</div></div>
        <div class="kpi blue"><div class="num">${totalMinutes(leg.id)}</div><div class="label">合計時間（分）</div></div>
      </div>
    </div>

    <div class="block">
      <div class="block-head"><span class="dot red"></span>居眠りイベント　タイムライン</div>
      <div class="block-body" style="padding-bottom:8px;">
        <p style="margin:0;color:var(--ink-soft);font-size:12px;">
          「本人・関係者の説明」列：緑＝説明があるもの／赤＝説明なしのもの。一方的な断定ではなく事情も併記しています。
        </p>
      </div>
      ${tableHtml}
    </div>
  `;
}

      <div class="block-body">

    <div class="block">

          <span class="comment-label">プレースホルダー</span>
          ここにXでのご意見募集ポスト・リンクが入る予定地 &nbsp;→&nbsp; <span class="video-cell-link" data-video="#demo-x">ダミーリンク</span>

/* ---------- 動画ダミーリンク・モーダル ---------- */

function bindVideoLinks(){
  document.querySelectorAll("[data-video]").forEach(el=>{
    el.addEventListener("click", e=>{
      e.preventDefault();
      document.getElementById("video-modal").classList.add("open");
    });
  });
}

function closeModal(){ document.getElementById("video-modal").classList.remove("open"); }
document.getElementById("video-modal-close").addEventListener("click", closeModal);
document.getElementById("video-modal-ok").addEventListener("click", closeModal);
document.getElementById("video-modal").addEventListener("click", e=>{
  if(e.target.id === "video-modal") closeModal();
});

window.addEventListener("hashchange", render);
window.addEventListener("resize", adjustChromePadding);
render();
